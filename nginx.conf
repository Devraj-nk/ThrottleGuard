events {}

http {
    upstream throttleguard {
        server gateway-1:8080;
        server gateway-2:8080;
        server gateway-3:8080;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://throttleguard;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
