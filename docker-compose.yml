services:
  gateway-1:
    build: .
    expose:
      - "8080"
    environment:
      - THROTTLEGUARD_BACKEND_URL=http://backend:9000
      - THROTTLEGUARD_REDIS_ADDR=redis:6379
      - THROTTLEGUARD_RATE_LIMIT=10
      - THROTTLEGUARD_RATE_WINDOW=1s
    depends_on:
      - "redis"
      - "backend"

  gateway-2:
    build: .
    expose:
      - "8080"
    environment:
      - THROTTLEGUARD_BACKEND_URL=http://backend:9000
      - THROTTLEGUARD_REDIS_ADDR=redis:6379
      - THROTTLEGUARD_RATE_LIMIT=10
      - THROTTLEGUARD_RATE_WINDOW=1s
    depends_on:
      - "redis"
      - "backend"

  gateway-3:
    build: .
    expose:
      - "8080"
    environment:
      - THROTTLEGUARD_BACKEND_URL=http://backend:9000
      - THROTTLEGUARD_REDIS_ADDR=redis:6379
      - THROTTLEGUARD_RATE_LIMIT=10
      - THROTTLEGUARD_RATE_WINDOW=1s
    depends_on:
      - "redis"
      - "backend"

  load-balancer:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - "gateway-1"
      - "gateway-2"
      - "gateway-3"

  "redis":
    image: redis:7-alpine
    ports:
      - "6379:6379"

  "backend":
    image: hashicorp/http-echo:1.0
    command: ["-listen=:9000", "-text=backend response"]
    expose:
      - "9000"
